<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0EA5E9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#0B1120" />

  <!-- Code2 / Terminal Brackets Icon with Glow -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path 
      d="M26 23 L17 32 L26 41" 
      stroke="url(#codeGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Right Bracket > -->
    <path 
      d="M38 23 L47 32 L38 41" 
      stroke="url(#codeGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Center Slash / Accent Dot -->
    <line 
      x1="34" y1="22" x2="30" y2="42" 
      stroke="#38BDF8" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      opacity="0.9"
    />
  </g>
</svg>
